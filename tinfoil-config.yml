cvm-version: 0.11.0
cpus: 2
memory: 2048

containers:
  - name: "metadata-fetch"
    image: "ghcr.io/tinfoilsh/confidential-website-metadata-fetcher@sha256:51d41c50a478370223397777b88a77743b4a0985492a4a3e87f234adb8fd58b5" # v0.0.13
    restart: always
    networks: [outbound]
    secrets:
      - CONTEXT_DEV_API_KEY

networks:
  outbound:
    egress: allowlist
    allow:
      - api.context.dev
      - icons.duckduckgo.com

shim:
  upstream-port: 8089
  paths:
    - /metadata
    - /favicon
    - /health
