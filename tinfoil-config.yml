cvm-version: 0.14.15
cpus: 2
memory: 2048

containers:
  - name: "metadata-fetch"
    image: "ghcr.io/tinfoilsh/confidential-website-metadata-fetcher@sha256:f80101d328fc1b4f31f3616e070444f99062fcbf932eb3e46122d31f1c5b9732" # v0.0.14
    restart: always
    networks: [outbound]
    secrets:
      - CONTEXT_DEV_API_KEY

networks:
  outbound:
    egress: allowlist
    allow:
      - api.context.dev
      - icons.duckduckgo.com

shim:
  upstream-port: 8089
  paths:
    - /metadata
    - /favicon
    - /health
