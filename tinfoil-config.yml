cvm-version: 0.10.4
cpus: 2
memory: 2048

containers:
  - name: "metadata-fetch"
    image: "ghcr.io/tinfoilsh/confidential-website-metadata-fetcher@sha256:3067431f24e2e70581982e636af5046d5a5d03056871f0c1f4be47c0d6938bc8" # v0.0.7
    restart: always
    networks: [outbound]
    secrets:
      - ZYTE_API_KEY

networks:
  outbound:
    egress: allowlist
    allow:
      - api.zyte.com
      - icons.duckduckgo.com

shim:
  upstream-port: 8089
  paths:
    - /metadata
    - /favicon
    - /health
