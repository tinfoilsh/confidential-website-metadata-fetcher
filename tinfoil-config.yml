cvm-version: 0.10.4
cpus: 2
memory: 2048

containers:
  - name: "metadata-fetch"
    image: "ghcr.io/tinfoilsh/confidential-website-metadata-fetcher@sha256:3ced6ea563243bc904667cc440b8c39a6320bfe5211b6dffa44562014382f52e" # v0.0.10
    restart: always
    networks: [outbound]
    secrets:
      - ZYTE_API_KEY

networks:
  outbound:
    egress: allowlist
    allow:
      - api.zyte.com
      - icons.duckduckgo.com

shim:
  upstream-port: 8089
  paths:
    - /metadata
    - /favicon
    - /health
